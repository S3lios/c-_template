steps:
  - name: Validate PR title and version
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    run: |
      set -euo pipefail
      if [[ "$PR_HEAD_REF" != "dev" ]]; then
        echo "::error::Pull requests targeting main must come from the dev branch."
        echo "Source branch: $PR_HEAD_REF"
        exit 1
      fi

      if [[ "$PR_HEAD_REPO" != "$REPO" ]]; then
        echo "::error::The dev branch must belong to this repository."
        exit 1
      fi
      
      if [[ ! "$PR_TITLE" =~ ^release:\ v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
        echo "::error::Invalid PR title."
        echo "Every PR targeting main must have a title like: release: v1.2.3"
        exit 1
      fi

      TAG="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"

      echo "Requested version: $TAG"

      TAGS=$(gh api "repos/$REPO/git/matching-refs/tags/" \
        --paginate \
        --jq '.[].ref' || true)

      if printf '%s\n' "$TAGS" | grep -Fxq "refs/tags/$TAG"; then
        echo "::error::Version $TAG already exists."
        exit 1
      fi

      LATEST_TAG=$(printf '%s\n' "$TAGS" \
        | sed 's#^refs/tags/##' \
        | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
        | sort -V \
        | tail -n 1 || true)

      if [[ -n "$LATEST_TAG" ]]; then
        NEWER=$(printf '%s\n%s\n' "$LATEST_TAG" "$TAG" | sort -V | tail -n 1)

        if [[ "$NEWER" != "$TAG" ]]; then
          echo "::error::Version $TAG must be greater than $LATEST_TAG."
          exit 1
        fi
      fi

      echo "Version $TAG is valid."
